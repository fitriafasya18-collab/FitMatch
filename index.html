<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prototipe FitMatch</title>

  <!-- Font Archivo dari Google Fonts (butuh internet; tanpa internet, font cadangan sistem dipakai) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <!-- Semua tampilan (warna, ukuran, tata letak) ada di file ini -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== Bilah atas halaman ===== -->
<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="img/logo.png" alt="FitMatch">
  </div>
  <div class="topbar-right">
    <span class="topbar-note">Prototipe UTS Design Thinking</span>
    <button type="button" class="theme-btn" id="themeToggle"></button>
  </div>
</header>

<main class="stage">

  <!-- ===== KIRI: ponsel tempat aplikasi berjalan ===== -->
  <section class="device-col" aria-label="Prototipe aplikasi">
    <div class="phone">
      <div class="device" id="phone">

        <!-- Status bar tiruan (disembunyikan di layar HP sungguhan) -->
        <div class="statusbar" aria-hidden="true">
          <span>09.41</span>
          <span class="island"></span>
          <span class="statusbar-icons">
            <svg viewBox="0 0 18 12"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 26 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3.5" fill="none" stroke="currentColor"/><rect x="2.5" y="2.5" width="15" height="7" rx="2"/><rect x="24" y="4" width="2" height="4" rx="1"/></svg>
          </span>
        </div>

        <!-- Isi layar diganti oleh js/app.js sesuai menu yang dipilih -->
        <div class="screen" id="screen"></div>

        <!-- Menu bawah: 4 tab -->
        <nav class="nav" id="nav" aria-label="Menu aplikasi">
          <button type="button" data-action="tab" data-tab="lemari">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6.5a2 2 0 1 1 2.6 1.9c-.4.1-.6.5-.6.9V10"/><path d="M12 10 3 17.2c-.6.5-.3 1.3.5 1.3h17c.8 0 1.1-.8.5-1.3L12 10Z"/></svg>
            <span>Lemari</span>
          </button>
          <button type="button" data-action="tab" data-tab="Match">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15l-1.8-4.4L5.5 9l4.7-1.4z"/><path d="M18 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
            <span>Match</span>
          </button>
          <button type="button" class="scan-btn" data-action="tab" data-tab="scan" aria-label="Scan baju">
            <span class="scan-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M4 12h16"/></svg></span>
          </button>
          <button type="button" data-action="tab" data-tab="pref">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
            <span>Gaya</span>
          </button>
        </nav>

        <!-- Panel detail baju yang muncul dari bawah -->
        <div class="sheet-wrap" id="sheetWrap" hidden>
          <button type="button" class="scrim" data-action="close-sheet" aria-label="Tutup detail"></button>
          <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detail baju"></div>
        </div>

        <!-- Notifikasi singkat -->
        <div class="toast" id="toast" role="status" aria-live="polite"></div>

        <!-- Layar login, diisi oleh js/auth.js -->
        <div class="auth" id="auth" hidden></div>
      </div>
    </div>

    <!-- Input foto tersembunyi, dipanggil dari tombol "Foto atau unggah baju" -->
    <input type="file" id="fileInput" accept="image/*" capture="environment" hidden>
  </section>

  <!-- ===== KANAN: panduan untuk penguji ===== -->
</main>

<!-- Urutan file JavaScript PENTING: data dulu, lalu AI, lalu aplikasi -->
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
